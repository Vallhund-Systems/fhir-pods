[package]
name = "fhir-pods-ffi"
version = "0.26.0"
edition = "2021"
rust-version = "1.87"   # const reads of the registry statics (1.83), usize::is_multiple_of (1.87)
license = "MIT"
description = "Shared C ABI for the fhir-pods compliance runtime, compiled for WebAssembly and native applications."
publish = false

[lib]
# staticlib -> iOS XCFramework (.a); cdylib -> .so / .dylib / .wasm; rlib -> normal crate use.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
fhir-pods-core = { path = "../fhir-pods-core" }

# Android only: the JNI shim the Kotlin wrapper calls. Every other target
# (wasm32, iOS, host) stays dependency-free.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[features]
# A host's own profiles, compiled at build time (scripts/gen-host-profiles.sh).
host-profiles = ["fhir-pods-core/host-profiles"]
