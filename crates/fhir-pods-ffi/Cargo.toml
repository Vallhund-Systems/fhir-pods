[package]
name = "fhir-pods-ffi"
version = "0.8.1"
edition = "2021"
license = "MIT"
description = "Lean C-ABI surface for fhir-pods. One ABI, compiled per target: wasm32 for web/edge, native staticlib for the expo pod."
publish = false

[lib]
# staticlib -> iOS XCFramework (.a); cdylib -> .so / .dylib / .wasm; rlib -> normal crate use.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
fhir-pods-core = { path = "../fhir-pods-core" }

# Android only: the JNI shim the Kotlin wrapper calls. Every other target
# (wasm32, iOS, host) stays dependency-free.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }
