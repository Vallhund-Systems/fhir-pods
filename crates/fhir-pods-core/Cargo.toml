[package]
name = "fhir-pods-core"
version = "0.10.0"
edition = "2021"
license = "MIT"
description = "Embeddable FHIR verifier + lowering core. No I/O, no server, no licensed terminology."
publish = false

[features]
# Opt-in conformance build only; prepared by conformance/testcase_profiles.py.
testcase-profiles = []

[dependencies]
# Intentionally zero external dependencies: the JSON parser, the FHIRPath and
# regex engines and the compiled profiles (src/generated, from tools/gen_all.py)
# are all in-crate, so the core stays no_std and audit-sized.
