[package]
name = "fhir-pods-wasm"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Lean C-ABI WASM boundary for fhir-pods (no wasm-bindgen)."
publish = false

[lib]
# cdylib for the .wasm artifact; rlib so the shim is usable as a normal crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
fhir-pods-core = { path = "../fhir-pods-core" }
