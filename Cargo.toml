# fhir-pods — an embeddable compliance runtime for health applications.
# Lift, lower, transform, assemble, and validate wherever the data is.

[workspace]
resolver = "2"
members = [
    "crates/fhir-pods-core",
    "crates/fhir-pods-ffi",
    "crates/fhir-pods-cli",
]
# The libFuzzer crate is standalone (needs nightly; carries libfuzzer-sys).
exclude = ["fuzz"]

# Size-first release profile — for the WASM target, the payload is the product.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
