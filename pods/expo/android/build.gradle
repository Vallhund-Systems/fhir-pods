plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.fhirpods'
version = '0.1.0'

android {
  namespace "expo.modules.fhirpods"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  // The Rust core, built per ABI by scripts/build-android-jnilibs.sh into
  // src/main/jniLibs/<abi>/libfhir_pods_ffi.so (the default jniLibs dir).
}
